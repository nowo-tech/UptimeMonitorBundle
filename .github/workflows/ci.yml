# CI: tests on PHP 8.2–8.5 × Symfony 7.4, 8.1 (exclusions for incompatible pairs).
# Coverage with PCOV; release updated via release.yml on tag push.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          # Symfony 8.1 requires PHP >=8.4.1; doctrine-bundle 3.x (Symfony 8) needs PHP ^8.4
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          SYMFONY="${{ matrix.symfony }}"
          composer require \
            symfony/clock:^${SYMFONY} \
            symfony/config:^${SYMFONY} \
            symfony/console:^${SYMFONY} \
            symfony/dependency-injection:^${SYMFONY} \
            symfony/form:^${SYMFONY} \
            symfony/framework-bundle:^${SYMFONY} \
            symfony/http-client:^${SYMFONY} \
            symfony/http-kernel:^${SYMFONY} \
            symfony/messenger:^${SYMFONY} \
            symfony/routing:^${SYMFONY} \
            symfony/scheduler:^${SYMFONY} \
            symfony/security-bundle:^${SYMFONY} \
            symfony/serializer:^${SYMFONY} \
            symfony/translation:^${SYMFONY} \
            symfony/twig-bundle:^${SYMFONY} \
            symfony/validator:^${SYMFONY} \
            symfony/yaml:^${SYMFONY} \
            --no-interaction --no-update
          composer require --dev \
            symfony/browser-kit:^${SYMFONY} \
            symfony/dom-crawler:^${SYMFONY} \
            symfony/mailer:^${SYMFONY} \
            symfony/mercure:^0.7.2 \
            symfony/phpunit-bridge:^${SYMFONY} \
            symfony/web-profiler-bundle:^${SYMFONY} \
            --no-interaction --no-update
          if [[ "${SYMFONY}" == 8.* ]]; then
            composer require doctrine/doctrine-bundle:^3.2 --no-interaction --no-update
          else
            composer require doctrine/doctrine-bundle:^2.18 --no-interaction --no-update
          fi
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: SearchKit (PHP 8.3 or later)
        run: .github/ci/search-kit.sh

      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - name: Run tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Run tests with coverage (PHP 8.3 + Symfony 7.4 only)
        if: matrix.php == '8.3' && matrix.symfony == '7.4'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage"
            exit 1
          fi
          echo "✅ Coverage generated"

  demo-smoke:
    # REQ-TEST-011: boot demo/symfony8 (FrankenPHP + MySQL) and expect HTTP 200 on /uptime/main.
    name: Demo smoke (HTTP 200)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker Compose version
        run: docker compose version

      - name: Run demo smoke
        run: make demo-smoke

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: SearchKit (PHP 8.3 or later)
        run: .github/ci/search-kit.sh

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

      - name: PHPDoc on every class and public method of src/ (REQ-CS-001)
        run: php .scripts/complete-public-phpdoc.php

  frontend:
    name: Frontend (Vitest, coverage gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v6

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest with coverage (fails under the vitest.config.ts thresholds, REQ-TEST-003)
        run: pnpm run test:coverage

      - name: Build assets
        run: pnpm run build

      # Audit GJ-I3: the committed bundle assets must be the build of the committed sources.
      - name: Committed assets match the build
        run: |
          git status --porcelain -- src/Resources/public
          git diff --exit-code -- src/Resources/public
          test -z "$(git status --porcelain --untracked-files=all -- src/Resources/public)"

  # 1.29 (Beacon spec 239): lock waits, deadlocks and concurrent processes on real servers (tests/Database, run with
  # fail-on-skipped), the deterministic race replays and, on DBAL 4, every `db` integration test. Passwordless services.
  load:
    name: Load readiness (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'MySQL 8.4', url: 'mysql://root@127.0.0.1:3306/uptime?serverVersion=8.4.0&charset=utf8mb4', dbal: '' }
          - { name: 'PostgreSQL 16', url: 'postgresql://postgres@127.0.0.1:5432/uptime?serverVersion=16&charset=utf8', dbal: '' }
          - { name: 'MySQL 8.4, DBAL 3', url: 'mysql://root@127.0.0.1:3306/uptime?serverVersion=8.4.0&charset=utf8mb4', dbal: '^3.8.2' }
          - { name: 'PostgreSQL 16, DBAL 3', url: 'postgresql://postgres@127.0.0.1:5432/uptime?serverVersion=16&charset=utf8', dbal: '^3.8.2' }
          - { name: 'MariaDB 11.4', url: 'mysql://root@127.0.0.1:3307/uptime?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '' }
          - { name: 'MariaDB 11.4, DBAL 3', url: 'mysql://root@127.0.0.1:3307/uptime?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '^3.8.2' }
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: uptime
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: uptime
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: uptime
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: SearchKit (PHP 8.3 or later; not with DBAL 3)
        if: ${{ matrix.dbal == '' }}
        run: .github/ci/search-kit.sh

      - name: Use DBAL 3
        if: ${{ matrix.dbal != '' }}
        run: composer require --no-interaction --no-progress --with-all-dependencies "doctrine/dbal:${{ matrix.dbal }}"

      - name: Lock wait, deadlock and multi-process tests
        timeout-minutes: 10
        env:
          UPTIME_TEST_DATABASE_URL: ${{ matrix.url }}
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped --testsuite database

      - name: Race replays
        timeout-minutes: 5
        env:
          UPTIME_TEST_DATABASE_URL: ${{ matrix.url }}
        run: vendor/bin/phpunit --no-coverage tests/Integration/Service/LoadReadinessDbTest.php

      - name: Integration tests on the real server (DBAL 4)
        if: ${{ matrix.dbal == '' }}
        timeout-minutes: 10
        env:
          UPTIME_TEST_DATABASE_URL: ${{ matrix.url }}
        run: vendor/bin/phpunit --no-coverage --group db

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: |
          SYMFONY="7.4"
          composer require \
            symfony/clock:^${SYMFONY} \
            symfony/config:^${SYMFONY} \
            symfony/console:^${SYMFONY} \
            symfony/dependency-injection:^${SYMFONY} \
            symfony/form:^${SYMFONY} \
            symfony/framework-bundle:^${SYMFONY} \
            symfony/http-client:^${SYMFONY} \
            symfony/http-kernel:^${SYMFONY} \
            symfony/messenger:^${SYMFONY} \
            symfony/routing:^${SYMFONY} \
            symfony/scheduler:^${SYMFONY} \
            symfony/security-bundle:^${SYMFONY} \
            symfony/serializer:^${SYMFONY} \
            symfony/translation:^${SYMFONY} \
            symfony/twig-bundle:^${SYMFONY} \
            symfony/validator:^${SYMFONY} \
            symfony/yaml:^${SYMFONY} \
            doctrine/doctrine-bundle:^2.18 \
            --no-interaction --no-update
          composer require --dev \
            symfony/browser-kit:^${SYMFONY} \
            symfony/dom-crawler:^${SYMFONY} \
            symfony/mailer:^${SYMFONY} \
            symfony/mercure:^0.7.2 \
            symfony/phpunit-bridge:^${SYMFONY} \
            symfony/web-profiler-bundle:^${SYMFONY} \
            --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: SearchKit (PHP 8.3 or later)
        run: .github/ci/search-kit.sh

      - name: Run tests with coverage (fails below 100%)
        run: |
          echo "🧪 Running tests with coverage (gate: 100% lines, REQ-TEST-003)..."
          rm -rf .phpunit.cache
          composer test-coverage-100
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "✅ coverage.xml generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  igor:
    name: Igor (FrankenPHP worker audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/uptime-monitor-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and Demo smoke
  # fails with "class not found"). Same job as BreadcrumbKit (txd-constraint-1118).
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Tests at the floor
        timeout-minutes: 20
        run: composer test
