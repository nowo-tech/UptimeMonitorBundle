services:
    _defaults:
        autowire: true
        autoconfigure: true
        # 1.27.0 (REQ-ARCH-001 rule 6): every bundle service reads and writes through the bundle's private entity
        # manager (Doctrine\UptimeEntityManager, defined by the extension) and the bundle's repositories on it; no bundle
        # service ever receives, flushes or resets an application manager.
        bind:
            Doctrine\ORM\EntityManagerInterface: '@Nowo\UptimeMonitorBundle\Doctrine\UptimeEntityManager'
            Doctrine\Persistence\ManagerRegistry: '@Nowo\UptimeMonitorBundle\Doctrine\UptimeManagerRegistry'
            Nowo\UptimeMonitorBundle\Repository\CheckAggregateRepository: '@nowo_uptime_monitor.repository.check_aggregate'
            Nowo\UptimeMonitorBundle\Repository\CheckResultRepository: '@nowo_uptime_monitor.repository.check_result'
            Nowo\UptimeMonitorBundle\Repository\IncidentRepository: '@nowo_uptime_monitor.repository.incident'
            Nowo\UptimeMonitorBundle\Repository\MonitorRepository: '@nowo_uptime_monitor.repository.monitor'
            Nowo\UptimeMonitorBundle\Repository\TagRepository: '@nowo_uptime_monitor.repository.tag'
            Nowo\UptimeMonitorBundle\Repository\TenantRepository: '@nowo_uptime_monitor.repository.tenant'

    Nowo\UptimeMonitorBundle\:
        resource: '../../'
        exclude:
            - '../../Controller/'
            - '../../DependencyInjection/'
            - '../../Doctrine/'
            - '../../Entity/'
            - '../../Event/'
            - '../../Notification/Channel/'
            - '../../UptimeMonitorBundle.php'
            - '../../Security/UptimeMonitorAccessCheckerInterface.php'
            - '../../Security/ConfigurableUptimeMonitorAccessChecker.php'
            - '../../Security/AllowAllUptimeMonitorAccessChecker.php'
            - '../../Limits/TenantLimitsInterface.php'
            - '../../Limits/ConfigurableTenantLimits.php'
            - '../../Push/PushPayload.php'
            - '../../Push/PushThresholds.php'
            # apply-monitors (1.18): value objects and exceptions, not services
            - '../../Apply/ApplyError.php'
            - '../../Apply/ApplyFailedException.php'
            - '../../Apply/ApplyRefusedException.php'
            - '../../Apply/ApplyResult.php'
            - '../../Apply/ExternalPushTokens.php'
            - '../../Apply/MonitorFileSpec.php'
            - '../../Apply/PushMonitorSpec.php'
            - '../../Apply/PushTokenPolicy.php'

    Nowo\UptimeMonitorBundle\Notification\Channel\EmailNotificationChannel:
        tags: ['nowo.uptime_monitor.notification_channel']

    nowo.uptime_monitor.notification.webhook:
        class: Nowo\UptimeMonitorBundle\Notification\Channel\WebhookNotificationChannel
        arguments:
            $channelKey: 'webhook'
        tags: ['nowo.uptime_monitor.notification_channel']

    nowo.uptime_monitor.notification.slack:
        class: Nowo\UptimeMonitorBundle\Notification\Channel\WebhookNotificationChannel
        arguments:
            $channelKey: 'slack'
        tags: ['nowo.uptime_monitor.notification_channel']

    # Route import `type: nowo_uptime_monitor` (tenant inside the host URLs when dashboard.path holds {tenantSlug}).
    Nowo\UptimeMonitorBundle\Routing\UptimeMonitorRouteLoader:
        tags: ['routing.loader']

    # The repository services by class name stay on the application registry (unchanged since 1.0): an application
    # that loads bundle entities through them gets entities of its own manager, which it can relate to its own entities
    # and flush. The bundle's own copies below work on the bundle's private manager.
    Nowo\UptimeMonitorBundle\Repository\:
        resource: '../../Repository/'
        arguments: ['@doctrine']

    nowo_uptime_monitor.repository.check_aggregate:
        class: Nowo\UptimeMonitorBundle\Repository\CheckAggregateRepository
        autoconfigure: false
        arguments: ['@Nowo\UptimeMonitorBundle\Doctrine\UptimeManagerRegistry']

    nowo_uptime_monitor.repository.check_result:
        class: Nowo\UptimeMonitorBundle\Repository\CheckResultRepository
        autoconfigure: false
        arguments: ['@Nowo\UptimeMonitorBundle\Doctrine\UptimeManagerRegistry']

    nowo_uptime_monitor.repository.incident:
        class: Nowo\UptimeMonitorBundle\Repository\IncidentRepository
        autoconfigure: false
        arguments: ['@Nowo\UptimeMonitorBundle\Doctrine\UptimeManagerRegistry']

    nowo_uptime_monitor.repository.monitor:
        class: Nowo\UptimeMonitorBundle\Repository\MonitorRepository
        autoconfigure: false
        arguments: ['@Nowo\UptimeMonitorBundle\Doctrine\UptimeManagerRegistry']

    nowo_uptime_monitor.repository.tag:
        class: Nowo\UptimeMonitorBundle\Repository\TagRepository
        autoconfigure: false
        arguments: ['@Nowo\UptimeMonitorBundle\Doctrine\UptimeManagerRegistry']

    nowo_uptime_monitor.repository.tenant:
        class: Nowo\UptimeMonitorBundle\Repository\TenantRepository
        autoconfigure: false
        arguments: ['@Nowo\UptimeMonitorBundle\Doctrine\UptimeManagerRegistry']

    # Global caps of every check (SEC-004 M1): checks.max_timeout_seconds / max_body_bytes / max_redirects.
    Nowo\UptimeMonitorBundle\Check\CheckLimits:
        arguments:
            $maxTimeoutSeconds: '%nowo_uptime_monitor.checks.max_timeout_seconds%'
            $maxBodyBytes: '%nowo_uptime_monitor.checks.max_body_bytes%'
            $maxRedirects: '%nowo_uptime_monitor.checks.max_redirects%'

    Nowo\UptimeMonitorBundle\Check\HttpCheckRunner:
        arguments:
            $blockPrivateUrls: '%nowo_uptime_monitor.checks.block_private_urls%'
        tags: ['nowo.uptime_monitor.check_runner']

    Nowo\UptimeMonitorBundle\Check\TcpCheckRunner:
        arguments:
            $blockPrivateUrls: '%nowo_uptime_monitor.checks.block_private_urls%'
        tags: ['nowo.uptime_monitor.check_runner']

    Nowo\UptimeMonitorBundle\Check\DnsCheckRunner:
        arguments:
            $blockPrivateUrls: '%nowo_uptime_monitor.checks.block_private_urls%'
        tags: ['nowo.uptime_monitor.check_runner']

    Nowo\UptimeMonitorBundle\Check\SslCheckRunner:
        arguments:
            $blockPrivateUrls: '%nowo_uptime_monitor.checks.block_private_urls%'
        tags: ['nowo.uptime_monitor.check_runner']

    Nowo\UptimeMonitorBundle\Check\PingCheckRunner:
        arguments:
            $blockPrivateUrls: '%nowo_uptime_monitor.checks.block_private_urls%'
        tags: ['nowo.uptime_monitor.check_runner']

    Nowo\UptimeMonitorBundle\Check\GroupCheckRunner:
        tags: ['nowo.uptime_monitor.check_runner']

    Nowo\UptimeMonitorBundle\Check\PushCheckRunner:
        tags: ['nowo.uptime_monitor.check_runner']

    # DDD ports (1.25): the documented write entry points behind interfaces (host code type-hints these).
    Nowo\UptimeMonitorBundle\Apply\MonitorApplierInterface: '@Nowo\UptimeMonitorBundle\Apply\MonitorApplier'
    Nowo\UptimeMonitorBundle\Service\TenantProvisionerInterface: '@Nowo\UptimeMonitorBundle\Service\TenantProvisioner'

    # apply-monitors (1.18): the token intake's system calls.
    Nowo\UptimeMonitorBundle\Apply\TokenSourceSystem: '@Nowo\UptimeMonitorBundle\Apply\NativeTokenSourceSystem'

    Nowo\UptimeMonitorBundle\Command\:
        resource: '../../Command/'
        tags: ['console.command']

    # Controllers are not autoconfigured (REQ-SF-004 rule 7): on Symfony >= 7.3 autoconfiguration tags every #[Route]
    # class with `routing.controller`, and the host's default `routing.controllers` resource would then load the bundle
    # routes without the host importing them (bypassing dashboard.path / status_page.path / push.path, web_ui.enabled
    # and the route loader). The tags autoconfiguration gave them are set explicitly instead.
    Nowo\UptimeMonitorBundle\Controller\:
        resource: '../../Controller/'
        exclude:
            - '../../Controller/PushController.php'
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    # Not an AbstractController: no service subscriber.
    Nowo\UptimeMonitorBundle\Controller\PushController:
        autoconfigure: false
        tags: ['controller.service_arguments']

    Nowo\UptimeMonitorBundle\Controller\DashboardController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $mercureHub: '@?mercure.hub.default'
            $mercureAuthorization: '@?Symfony\Component\Mercure\Authorization'

    # Lifecycle events (1.25): the actor comes from the security token when SecurityBundle is installed.
    Nowo\UptimeMonitorBundle\Controller\MonitorController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $tokenStorage: '@?security.token_storage'

    Nowo\UptimeMonitorBundle\EventSubscriber\UptimeMonitorAccessSubscriber:
        arguments:
            $allowUnauthenticated: '%nowo_uptime_monitor.security.allow_unauthenticated%'
            $tokenStorage: '@?security.token_storage'
            $webUiEnabled: '%nowo_uptime_monitor.web_ui.enabled%'
            $deniedTenantStatus: '%nowo_uptime_monitor.security.denied_tenant_status%'

    Nowo\UptimeMonitorBundle\Security\MonitorReadScope:
        arguments:
            $tokenStorage: '@?security.token_storage'
            $allowUnauthenticated: '%nowo_uptime_monitor.security.allow_unauthenticated%'

    # Optional security services: an `#[Autowire('@?…')]` attribute does not make an optional reference, so the CSRF
    # token manager of the POST page actions (pause, delete, push token) was never injected before 1.14.1.
    Nowo\UptimeMonitorBundle\Ui\UptimeActions:
        arguments:
            $tokenStorage: '@?security.token_storage'
            $csrf: '@?security.csrf.token_manager'

    Nowo\UptimeMonitorBundle\Ui\UptimePages:
        arguments:
            $twig: '@?twig'

    Nowo\UptimeMonitorBundle\Service\DashboardSyncDispatcher:
        arguments:
            $hub: '@?mercure.hub.default'

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\UptimeMonitorBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']

    # 1.26.0: resets only the bundle's own entity manager (rule 6), never a host one; since 1.27.0 that is the private
    # manager, reached through the bundle registry (bound above).
    Nowo\UptimeMonitorBundle\EventSubscriber\ClosedEntityManagerSubscriber:
        arguments:
            $entityManagerName: null
