nowo_uptime_monitor:
    connection: default
    # Demo-only: firewall security off + allow_unauthenticated (never use in production).
    security:
        access_roles: []
        allow_unauthenticated: true
        dashboard_roles: []
        manage_roles: []
        settings_roles: []
    ui:
        framework: bootstrap
    scheduler:
        enabled: true
        mode: scheduler
        tick: '15 seconds'
    retention:
        detail_days: 30
        purge_enabled: true
    dashboard:
        path: /uptime
        # Polling avoids Mercure cookie domain issues on localhost demo (smoke / release-verify).
        sync: polling
        poll_interval_ms: 30000
        mercure:
            topic_template: '/uptime/{tenant}'
            private: true
    multi_tenant:
        default_tenant: main
