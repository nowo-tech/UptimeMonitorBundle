name: uptime-monitor-bundle-demo-symfony-8

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uptime-monitor-demo-symfony8-php
    working_dir: /app
    ports:
      - "${PORT:-8011}:80"
    volumes:
      - .:/app
      - ../..:/var/uptime-monitor-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      APP_ENV: dev
      FRANKENPHP_MODE: ${FRANKENPHP_MODE:-worker}
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-demo-secret}
      DATABASE_URL: mysql://app:app@database:3306/app?serverVersion=8.4&charset=utf8mb4
      MERCURE_URL: http://php/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:${PORT:-8011}/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6) — REQ-DEMO-009.
    # Do not remove; on networks that block public DNS, replace with your resolvers in an uncommitted override.
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - uptime-monitor-demo-network
    depends_on:
      database:
        condition: service_healthy

  checks-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uptime-monitor-demo-symfony8-checks
    working_dir: /app
    entrypoint: []
    volumes:
      - .:/app
      - ../..:/var/uptime-monitor-bundle
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://app:app@database:3306/app?serverVersion=8.4&charset=utf8mb4
      MERCURE_URL: http://php/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:${PORT:-8011}/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
    command:
      - sh
      - -c
      - |
        while true; do
          php bin/console nowo:uptime:run-due-checks --no-ansi 2>&1 || true
          sleep 15
        done
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - uptime-monitor-demo-network

  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql
    # No `ports:` mapping (REQ-DEMO-006): MySQL is reachable only on the Compose network as `database:3306`.
    expose:
      - "3306"
    networks:
      - uptime-monitor-demo-network

volumes:
  database_data:
  composer-cache:

networks:
  uptime-monitor-demo-network:
    driver: bridge
