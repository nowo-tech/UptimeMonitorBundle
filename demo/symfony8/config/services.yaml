services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Demo-only console commands (app:uptime:demo-history backfills screenshot/e2e history).
    App\Command\:
        resource: '../src/Command/'

    # Demo of MonitorShowLiveUpdatesEvent (1.30): ?live=paused | notify on a monitor page.
    App\EventListener\:
        resource: '../src/EventListener/'
