# UiKit page contract (REQ-UI-003): one host layout and one theme for every bundle page. The UiKit default palette
# (light + dark) applies; a host sets nowo_ui_kit.theme.tokens / tokens_dark to brand it.
nowo_ui_kit:
    css_framework: none
    icon_set: svg_inline
    layouts:
        admin: 'layouts/admin.html.twig'
