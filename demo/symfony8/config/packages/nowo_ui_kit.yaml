# UiKit page contract (REQ-UI-003) and REQ-DEMO-014: one host layout pair and UiKit's default theme, unchanged (no CSS
# framework, no CDN, no token override).
nowo_ui_kit:
    css_framework: custom
    # No icon font and no CDN: row actions show their text labels.
    icon_set: none
    row_actions_display: text
    layouts:
        admin: 'layouts/admin.html.twig'
        guest: 'layouts/guest.html.twig'
