# UiKit page contract (REQ-UI-003): one host layout pair and one theme for every bundle page. The demo host layouts
# load Bootstrap 5 + Bootstrap Icons (templates/layouts/_framework.html.twig) to match css_framework / icon_set.
nowo_ui_kit:
    css_framework: bootstrap5
    icon_set: bootstrap-icons
    layouts:
        admin: 'layouts/admin.html.twig'
        guest: 'layouts/guest.html.twig'
