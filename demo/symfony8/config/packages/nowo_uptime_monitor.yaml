nowo_uptime_monitor:
    connection: default
    # Demo-only: firewall security off + allow_unauthenticated (never use in production).
    security:
        access_roles: []
        allow_unauthenticated: true
        roles:
            dashboard: []
            manage: []
            settings: []
    # Pages are UiKit scaffolds (REQ-UI-003): layout and theme come from config/packages/nowo_ui_kit.yaml.
    web_ui:
        path_prefix: /uptime
    # Demo-only: every demo monitor probes this app over the Compose network (http://php/demo/uptime/*), a
    # private address the SSRF guard blocks by default. Keep the default (true) in production.
    checks:
        block_private_urls: false
    scheduler:
        enabled: true
        mode: scheduler
        tick: '15 seconds'
    retention:
        detail_days: 30
        purge_enabled: true
    dashboard:
        # Polling avoids Mercure cookie domain issues on localhost demo (smoke / release-verify).
        sync: polling
        poll_interval_ms: 30000
        mercure:
            topic_template: '/uptime/{tenant}'
            private: true
    multi_tenant:
        default_tenant: main
